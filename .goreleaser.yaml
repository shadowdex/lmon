version: 2
project_name: lmon

builds:
  - main: .
    binary: lmon
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt # install.sh verifies downloads against this

git:
  # A stable release's notes should cover everything since the previous *stable*
  # release, not just since the last pre-release (v0.2.0's notes would otherwise
  # be only the commits after v0.2.0-rc1). The release workflow sets IGNORE_TAG
  # to "*-*" when the tag being released is stable, and to "" for a pre-release.
  ignore_tags:
    - '{{ if index .Env "IGNORE_TAG" }}{{ .Env.IGNORE_TAG }}{{ end }}'

changelog:
  abbrev: 7 # short hashes; entries stay in git-log order (newest first)
  filters:
    exclude: ['^Merge ']

release:
  prerelease: auto # v0.1.0-rc1 is marked a pre-release and is skipped by "latest"

# Homebrew and Scoop are intentionally not set up: a tap needs its own repo and a
# token (see README). Installing is via install.sh, `go install`, or the archives.
